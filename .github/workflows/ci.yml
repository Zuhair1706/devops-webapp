name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present."

      - name: Validate HTML
        run: |
          grep -q "<!DOCTYPE html>" index.html
          grep -q "<title>DevOps WebApp</title>" index.html
          echo "HTML validation successful."

      - name: Build project
        run: |
          mkdir -p build
          cp index.html style.css script.js build/
          echo "Build completed successfully."

      - name: Display build output
        run: |
          echo "Build directory contents:"
          ls -la build

name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present."

      - name: Validate HTML
        run: |
          echo "Validating HTML..."
          test -s index.html
          grep -qi "doctype html" index.html
          grep -qi "<title>" index.html
          echo "HTML validation successful."

      - name: Build project
        run: |
          echo "Building static website..."
          mkdir -p build
          cp index.html style.css script.js build/
          echo "Build completed successfully."

      - name: Verify build output
        run: |
          echo "Build directory contents:"
          ls -la build
          test -f build/index.html
          test -f build/style.css
          test -f build/script.js
          echo "Build verification successful."

      - name: Send Slack Success Notification
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          webhook = os.environ["SLACK_WEBHOOK_URL"]

          message = {
              "text": "✅ CI Pipeline Successful!\nRepository: "
                      + os.environ["GITHUB_REPOSITORY"]
                      + "\nBranch: "
                      + os.environ["GITHUB_REF_NAME"]
          }

          data = json.dumps(message).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Slack response:", response.read().decode())
          PY

      - name: Send Slack Failure Notification
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          webhook = os.environ["SLACK_WEBHOOK_URL"]

          message = {
              "text": "❌ CI Pipeline Failed!\nRepository: "
                      + os.environ["GITHUB_REPOSITORY"]
                      + "\nBranch: "
                      + os.environ["GITHUB_REF_NAME"]
          }

          data = json.dumps(message).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Slack response:", response.read().decode())
          PY
